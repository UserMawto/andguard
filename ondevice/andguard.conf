# andguard-ondevice 配置示例 —— 推到 /data/local/tmp/andguard.conf 生效
# 格式: KEY=value (shell 语法)

# 永不治理(空格分隔)
EXCLUDE="com.tencent.mm com.eg.android.AlipayGphone"

# 治理名单；留空 = 自动取全部用户应用
MANAGED=""

# 后台CPU% ≥ 此值 → 挂起 (连续 BG_HITS 次)
BG_CPU=40
BG_HITS=3

# 可用内存% 阈值
MEM_WARN=25
MEM_CRIT=12
TRIM_GB=1

# "真杀"阈值与开关 (KILL_ENABLE=1 开启)
KILL_CPU=200
KILL_ENABLE=0

# 挂起方式: appops(轻,后台冻结,前台还能开) / freeze(pm disable,完全停用)
SUSPEND_METHOD=appops

# 采样间隔秒
INTERVAL=5
